apiVersion: apps/v1
kind: Deployment
metadata:
  name: history
spec:
  replicas: 1
  selector:
    matchLabels:
      app: history
  template:
    metadata:
      labels:
        app: history
    spec:
      containers:
        - name: history
          image: pixelboard-history
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: pixelboard-config
          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: MONGO_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: history
spec:
  type: ClusterIP
  selector:
    app: history
  ports:
    - port: 3001
      targetPort: 3001
