apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pixelboard

resources:
  - namespace.yaml
  - config.yaml
  - secret.yaml
  - mongo.yaml
  - canvas.yaml
  - history.yaml
  - web.yaml

# Docker Hub images, the deployments use the short names
images:
  - name: pixelboard-canvas
    newName: teddok/pixelboard-canvas
    newTag: "1.0"
  - name: pixelboard-history
    newName: teddok/pixelboard-history
    newTag: "1.0"
  - name: pixelboard-web
    newName: teddok/pixelboard-web
    newTag: "1.0"
