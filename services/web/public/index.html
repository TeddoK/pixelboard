<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pixelboard</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #f4f4f4; }
    h1 { margin-top: 0; }
    .row { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    #board { image-rendering: pixelated; border: 1px solid #999; background: #fff; cursor: crosshair; }
    button { padding: .4rem .8rem; }
    #status { color: #666; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Pixelboard</h1>
  <div class="row">
    <label>Colour <input type="color" id="color" value="#1e88e5"></label>
    <button id="replay">Replay history</button>
    <span id="status">loading</span>
  </div>
  <canvas id="board" width="64" height="64"></canvas>
  <script src="app.js"></script>
</body>
</html>
